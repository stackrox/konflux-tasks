apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wait-for-image
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: |
    Waits until the specified image is found and returns its digest.
    Additionally, checks whether the image was built for the same commit as triggered the running pipeline (if the image is from the same repo).
    Also checks that the build pipeline of the image fully succeeded.
  params:
  - name: IMAGE
    description: Image reference.
    type: string
  results:
  - name: IMAGE_DIGEST
    description: Image digest in the format `sha256:abcdef0123`.
  steps:
  - name: wait-for-image
    image: quay.io/konflux-ci/release-service-utils:latest@sha256:9db0cc6b09799f41c87d46589dcd2c1ba66edfcaab3b88b99e2fcbc0646424bf
    imagePullPolicy: IfNotPresent
    env:
    - name: DESIRED_GIT_REF
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['pipelinesascode.tekton.dev/sha']
    - name: REPOSITORY_URL
      valueFrom:
        fieldRef:
          fieldPath: metadata.annotations['pipelinesascode.tekton.dev/repo-url']
    script: |
      #!/usr/bin/env bash

      set -euo pipefail

      echo "Waiting for image $(params.IMAGE) to become available..."
      while true; do
        if ! raw_info="$(skopeo inspect \
          --retry-times 10 \
          --format '{{.Digest}} {{ index .Labels "vcs-ref" }} {{ index .Labels "source-location" }}' \
          --no-tags \
          "docker://$(params.IMAGE)" 2>/dev/null)"; then
          >&2 echo "INFO: Image not found yet: $(params.IMAGE)."
          # Continue waiting and skip below logic
          sleep 1m
          continue
        fi

        # Turning raw_info into an array for easier handling.
        infos=( $raw_info )
        if [[ "${#infos[@]}" -ne 3 ]]; then
          >&2 echo "ERROR: Not all required information was found. Verify that the 'vcs-ref' and 'source-location' labels are set on the image $(params.IMAGE)."
          exit 1
        fi

        digest="${infos[0]}"
        git_ref_from_label="${infos[1]}"
        repository_from_label="${infos[2]}"
        IMAGE_WITH_DIGEST="$(params.IMAGE)@${digest}"

        if [[ "${repository_from_label}" == "${REPOSITORY_URL}" ]]; then
          >&2 echo "INFO: Checking the Git reference is required because this image is built from the same repository as the current pipeline."
          if [[ "${git_ref_from_label}" == "${DESIRED_GIT_REF}" ]]; then
            >&2 echo "INFO: The found image ${IMAGE_WITH_DIGEST} is built for the expected commit (${DESIRED_GIT_REF})."
            break
          else
            >&2 echo "WARNING: The found image ${IMAGE_WITH_DIGEST} seems to be built for a different commit (${git_ref_from_label}) than the one expected (${DESIRED_GIT_REF}). This could happen for a tagged build when a git tag was moved and newly-triggered pipelines haven't finished yet. This task will keep waiting for the image with the matching git sha to appear."
            # Continue waiting
            sleep 1m
          fi
        else
          >&2 echo "INFO: Skipping the Git reference check for this image since it is built from a different repository than the current pipeline."
          break
        fi
      done

      echo "Image $(params.IMAGE) found."

      # Output
      echo -n "${digest}" | tee "$(results.IMAGE_DIGEST.path)"
      echo

      echo "Waiting for attestation for ${IMAGE_WITH_DIGEST} to appear..."
      while true; do
        if cosign tree "${IMAGE_WITH_DIGEST}" | grep -qE "quay.io/.*:sha256-.*\.att$"; then
          break
        fi
        echo "Attestation for ${IMAGE_WITH_DIGEST} not (yet) found, sleeping and retrying..."
        sleep 1m
      done

      echo "Attestation for ${IMAGE_WITH_DIGEST} found, which means PipelineRun finished. Checking if any tasks finished unsuccessfully."

      att_file="$(mktemp)"
      v02_predicate_type="https://slsa.dev/provenance/v0.2"
      v1_predicate_type="https://slsa.dev/provenance/v1"

      cosign download attestation "${IMAGE_WITH_DIGEST}" | \
        jq -r '.payload' | \
        base64 -d > "${att_file}"

      predicate_type="$(jq -r '.predicateType' "${att_file}")"
      echo "Predicate type of the attestation: ${predicate_type}"

      if [[ "${predicate_type}" == "${v02_predicate_type}" ]]; then
        not_succeeded_count="$(jq '
          [
            .predicate.buildConfig.tasks[]
            | select(.status != "Succeeded")
          ]
          | length
        ' "${att_file}")"
      elif [[ "${predicate_type}" == "${v1_predicate_type}" ]]; then
        build_type="$(jq -r '.predicate.buildDefinition.buildType' "${att_file}")"
        if [[ "${build_type}" == "https://tekton.dev/chains/v2/slsa-tekton" ]]; then
          not_succeeded_count="$(jq '
            [
              .predicate.buildDefinition.resolvedDependencies[]
              | select(.name == "pipelineTask")
              | .content
              | @base64d
              | fromjson
              | select(
                  ([.status.conditions[]? | select(.type == "Succeeded" and .status == "True")] | length) == 0
                )
            ]
            | length
          ' "${att_file}")"
        else
          >&2 echo "ERROR: Unknown build type: ${build_type}"
          exit 1
        fi
      else
        >&2 echo "ERROR: Unknown predicate type: ${predicate_type}"
        exit 1
      fi

      if [[ "${not_succeeded_count}" -gt 0 ]]; then
        >&2 echo "ERROR: At least one task has failed during build of ${IMAGE_WITH_DIGEST}."
        >&2 echo "ERROR: This image will likely fail Conforma checks. Try building it again and re-run this pipeline."
        exit 1
      else
        echo "The pipeline that built ${IMAGE_WITH_DIGEST} finished successfully."
        echo "Accepting this image."
      fi
